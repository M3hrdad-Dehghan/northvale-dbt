models:
  - name: dim_customers
    description: One row per customer, with region and completed-order history.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: region
        description: Sales region from the provinces seed.
        data_tests: [not_null]
      - name: customer_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['repeat', 'one-time', 'no orders']